<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Antrenament</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f14;--surface:#141720;--surface2:#1c2030;--border:#272c3d;
    --accent:#c8f04d;--accent2:#4df0b4;--accent3:#f04d7a;
    --text:#e8eaf0;--muted:#5a6080;--warm:#f0c44d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;padding:0 0 80px;overflow-x:hidden;}
  .header{padding:28px 20px 14px;position:relative;overflow:hidden;}
  .header::before{content:'';position:absolute;top:-40px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,240,77,0.1) 0%,transparent 70%);pointer-events:none;}
  .header-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .header-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.1;}
  .header-sub{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1px;}
  .session-toggle{display:flex;gap:8px;margin:14px 20px 0;}
  .sess-btn{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.2s;letter-spacing:1px;text-transform:uppercase;}
  .sess-btn.active{background:rgba(200,240,77,0.1);border-color:var(--accent);color:var(--accent);}
  .sess-btn.active.evening{background:rgba(77,240,180,0.1);border-color:var(--accent2);color:var(--accent2);}
  .week-bar{margin:12px 20px 0;background:var(--surface2);border-radius:4px;height:3px;overflow:hidden;}
  .week-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width 0.6s ease;}
  .week-stats{display:flex;justify-content:space-between;margin:5px 20px 0;font-size:10px;color:var(--muted);letter-spacing:1px;}
  .week-stats .hi{color:var(--accent);}
  .day-nav{display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none;}
  .day-nav::-webkit-scrollbar{display:none;}
  .day-pill{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .day-pill .pill-abbr{font-weight:500;letter-spacing:1px;}
  .day-pill .pill-dot{width:4px;height:4px;border-radius:50%;background:var(--border);transition:background 0.2s;}
  .day-pill.done .pill-dot{background:var(--accent);}
  .day-pill.active{border-color:var(--accent);background:rgba(200,240,77,0.08);color:var(--accent);}
  .day-pill:hover:not(.active){border-color:var(--muted);color:var(--text);}
  .day-card{margin:14px 20px 0;background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;animation:slideUp 0.3s ease;}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .day-card-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
  .day-card-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
  .day-card-meta{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1px;text-transform:uppercase;}
  .day-focus{font-size:10px;color:var(--accent2);margin-top:3px;font-style:italic;}
  .day-tag{padding:4px 9px;border-radius:20px;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;flex-shrink:0;margin-left:8px;}
  .tag-push{background:rgba(200,240,77,0.1);color:var(--accent);border:1px solid rgba(200,240,77,0.25);}
  .tag-pull{background:rgba(77,240,180,0.1);color:var(--accent2);border:1px solid rgba(77,240,180,0.25);}
  .tag-lower{background:rgba(240,196,77,0.1);color:var(--warm);border:1px solid rgba(240,196,77,0.25);}
  .tag-cardio{background:rgba(240,77,122,0.1);color:var(--accent3);border:1px solid rgba(240,77,122,0.25);}
  .tag-full{background:rgba(150,120,255,0.1);color:#b4a0ff;border:1px solid rgba(150,120,255,0.25);}
  .tag-recovery{background:rgba(90,96,128,0.15);color:var(--muted);border:1px solid rgba(90,96,128,0.3);}
  .section{border-bottom:1px solid var(--border);}
  .section:last-child{border-bottom:none;}
  .section-header{padding:11px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background 0.15s;}
  .section-header:hover{background:var(--surface2);}
  .section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;}
  .section-count{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .progress-mini{width:28px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
  .progress-mini-fill{height:100%;background:var(--accent);transition:width 0.3s;}
  .chevron{font-size:10px;color:var(--muted);transition:transform 0.2s;margin-left:6px;}
  .section.collapsed .chevron{transform:rotate(-90deg);}
  .section-body{padding:0 20px 10px;}
  .section.collapsed .section-body{display:none;}
  .snote{font-size:10px;padding:6px 10px;border-radius:6px;margin-bottom:6px;border-left:2px solid var(--border);line-height:1.5;font-style:italic;}
  .snote-warn{background:rgba(240,196,77,0.06);border-color:var(--warm);color:var(--warm);}
  .snote-ok{background:rgba(200,240,77,0.05);border-color:var(--accent);color:var(--accent);}
  .snote-info{background:rgba(77,240,180,0.05);border-color:var(--accent2);color:var(--accent2);}
  .exercise{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(39,44,61,0.5);}
  .exercise:last-child{border-bottom:none;}
  .ex-check-wrap{flex-shrink:0;cursor:pointer;margin-top:1px;}
  .ex-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .exercise.done .ex-check{background:var(--accent);border-color:var(--accent);}
  .exercise.done .ex-check::after{content:'✓';font-size:11px;color:#0d0f14;font-weight:700;}
  .exercise.done .ex-name{color:var(--muted);text-decoration:line-through;}
  .ex-info{flex:1;cursor:pointer;min-width:0;}
  .ex-name{font-size:13px;color:var(--text);font-weight:500;font-family:'Syne',sans-serif;transition:color 0.2s;line-height:1.3;}
  .ex-sets{font-size:11px;color:var(--muted);margin-top:1px;}
  .ex-note{font-size:10px;color:var(--accent2);margin-top:2px;font-style:italic;line-height:1.3;}
  .ex-rehab{font-size:9px;color:var(--accent3);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .exercise.prio .ex-name::before{content:'★ ';color:var(--warm);font-size:11px;}
  .exercise.prio{background:rgba(240,196,77,0.05);border-radius:8px;padding-left:6px;margin-left:-6px;border-bottom-color:rgba(240,196,77,0.15)!important;}
  .timer-btn{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all 0.2s;}
  .timer-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(200,240,77,0.08);}
  .timer-btn:active{transform:scale(0.92);}
  .complete-btn{margin:14px 20px;width:calc(100% - 40px);padding:13px;border-radius:12px;border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
  .complete-btn.default{background:var(--accent);color:#0d0f14;}
  .complete-btn.completed{background:var(--surface2);color:var(--accent);border:1px solid var(--accent);}
  .notes-area{margin:0 20px 16px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);padding:10px 12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);width:calc(100% - 40px);resize:vertical;min-height:55px;outline:none;transition:border-color 0.2s;}
  .notes-area:focus{border-color:var(--muted);}
  .notes-area::placeholder{color:var(--muted);}
  .timer-overlay{position:fixed;inset:0;background:rgba(13,15,20,0.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeIn 0.2s ease;backdrop-filter:blur(8px);}
  .timer-overlay.hidden{display:none;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .timer-ex-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;text-align:center;padding:0 28px;max-width:320px;line-height:1.5;}
  .timer-ring-wrap{position:relative;width:200px;height:200px;margin-bottom:24px;}
  .timer-svg{transform:rotate(-90deg);width:200px;height:200px;}
  .timer-track{fill:none;stroke:var(--surface2);stroke-width:8;}
  .timer-arc{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.3s linear,stroke 0.4s;}
  .timer-arc.warning{stroke:var(--warm);}
  .timer-arc.danger{stroke:var(--accent3);}
  .timer-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .timer-count{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-1px;transition:color 0.3s;}
  .timer-count.warning{color:var(--warm);}
  .timer-count.danger{color:var(--accent3);}
  .timer-label{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px;text-transform:uppercase;}
  .timer-controls{display:flex;gap:10px;margin-bottom:14px;}
  .t-btn{padding:13px 22px;border-radius:12px;border:none;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.18s;}
  .t-btn-main{background:var(--accent);color:#0d0f14;min-width:120px;}
  .t-btn-close{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
  .timer-adjust{display:flex;gap:8px;align-items:center;}
  .t-adj{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .t-adj-label{font-size:11px;color:var(--muted);letter-spacing:1px;min-width:60px;text-align:center;}
  @keyframes doneFlash{0%{background:rgba(13,15,20,0.97);}30%{background:rgba(200,240,77,0.13);}100%{background:rgba(13,15,20,0.97);}}
  .timer-overlay.done-flash{animation:doneFlash 0.8s ease forwards;}
</style>
</head>
<body>
<div class="header">
  <div class="header-label">Program Personalizat · 12–16 Săptămâni</div>
  <div class="header-title">Hipertrofie<br>+ Rehab</div>
  <div class="header-sub">DIMINEAȚA SALĂ · SEARA ACASĂ · 6 ZILE / SĂPTĂMÂNĂ</div>
  <div style="font-size:10px;color:var(--warm);margin-top:6px;">★ = prioritar când timpul e limitat</div>
</div>
<div class="session-toggle">
  <button class="sess-btn active" id="btnMorning" onclick="setSession('morning')">☀ Dimineața – Sală</button>
  <button class="sess-btn evening" id="btnEvening" onclick="setSession('evening')">🌙 Seara – Acasă</button>
</div>
<div class="week-bar"><div class="week-bar-fill" id="weekFill" style="width:0%"></div></div>
<div class="week-stats">
  <span id="weekStatLeft">0 / 6 zile completate</span>
  <span class="hi" id="weekStatRight">0%</span>
</div>
<div class="day-nav" id="dayNav"></div>
<div id="dayContent"></div>
<div class="timer-overlay hidden" id="timerOverlay">
  <div class="timer-ex-name" id="timerExName">–</div>
  <div class="timer-ring-wrap">
    <svg class="timer-svg" viewBox="0 0 200 200">
      <circle class="timer-track" cx="100" cy="100" r="86"/>
      <circle class="timer-arc" id="timerArc" cx="100" cy="100" r="86"/>
    </svg>
    <div class="timer-center">
      <div class="timer-count" id="timerCount">30</div>
      <div class="timer-label" id="timerSubLabel">SECUNDE</div>
    </div>
  </div>
  <div class="timer-controls">
    <button class="t-btn t-btn-close" onclick="closeTimer()">✕</button>
    <button class="t-btn t-btn-main" id="timerMainBtn" onclick="toggleTimer()">▶ Start</button>
  </div>
  <div class="timer-adjust">
    <div class="t-adj" onclick="adjustTimer(-1)">−</div>
    <div class="t-adj-label" id="adjLabel">30 sec</div>
    <div class="t-adj" onclick="adjustTimer(1)">+</div>
  </div>
</div>

let state={activeDay:0,session:'morning',checked:{},completed:{},collapsed:{},notes:{}};
function loadState(){try{const s=localStorage.getItem('progV5');if(s)state=JSON.parse(s);}catch(e){}}
function saveState(){try{localStorage.setItem('progV5',JSON.stringify(state));}catch(e){}}
function setSession(s){
  state.session=s;saveState();
  document.getElementById('btnMorning').classList.toggle('active',s==='morning');
  document.getElementById('btnEvening').classList.toggle('active',s==='evening');
  document.getElementById('btnEvening').classList.toggle('evening',s==='evening');
  renderDay();
}
const CIRC=2*Math.PI*86;
let tInterval=null,tTotal=30,tRemain=30,tRunning=false;
function formatTime(s){if(s<60)return String(s);const m=Math.floor(s/60),sc=s%60;return m+':'+(sc<10?'0':'')+sc;}
function openTimer(name,sec){
  clearInterval(tInterval);tRunning=false;tTotal=sec;tRemain=sec;
  document.getElementById('timerExName').textContent=name;
  document.getElementById('timerMainBtn').textContent='▶ Start';
  document.getElementById('adjLabel').textContent=formatTime(sec);
  updateTimerUI();
  document.getElementById('timerOverlay').classList.remove('hidden','done-flash');
}
function closeTimer(){clearInterval(tInterval);tRunning=false;document.getElementById('timerOverlay').classList.add('hidden');}
function toggleTimer(){
  initAudio();
  if(tRunning){clearInterval(tInterval);tRunning=false;document.getElementById('timerMainBtn').textContent='▶ Continuă';}
  else{
    if(tRemain<=0){tRemain=tTotal;updateTimerUI();}
    tRunning=true;document.getElementById('timerMainBtn').textContent='❙❙ Pauză';
    tInterval=setInterval(tick,1000);
  }
}
function tick(){tRemain--;updateTimerUI();if(tRemain<=0){clearInterval(tInterval);tRunning=false;document.getElementById('timerMainBtn').textContent='↺ Restart';onDone();}}
// AudioContext creat la prima interacțiune — Safari necesită asta
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
document.addEventListener('touchstart',initAudio,{once:false,passive:true});
document.addEventListener('click',initAudio,{once:false,passive:true});

function playBeep(freq,startDelay,duration){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=freq;
    o.type='sine';
    const t=audioCtx.currentTime+startDelay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.4,t+0.01);
    g.gain.setValueAtTime(0.4,t+duration-0.05);
    g.gain.linearRampToValueAtTime(0,t+duration);
    o.start(t);
    o.stop(t+duration);
  }catch(e){}
}

function onDone(){
  document.getElementById('timerOverlay').classList.add('done-flash');
  // Resume AudioContext dacă e suspendat (Safari PWA)
  if(audioCtx && audioCtx.state==='suspended'){
    audioCtx.resume().then(()=>{
      playBeep(523,0,0.15);
      playBeep(659,0.2,0.15);
      playBeep(784,0.4,0.3);
    });
  } else {
    playBeep(523,0,0.15);
    playBeep(659,0.2,0.15);
    playBeep(784,0.4,0.3);
  }
}
function updateTimerUI(){
  const pct=tRemain/tTotal,arc=document.getElementById('timerArc'),cnt=document.getElementById('timerCount');
  arc.style.strokeDasharray=CIRC;arc.style.strokeDashoffset=CIRC*(1-pct);
  cnt.textContent=formatTime(tRemain);
  arc.classList.remove('warning','danger');cnt.classList.remove('warning','danger');
  if(tRemain<=5){arc.classList.add('danger');cnt.classList.add('danger');}
  else if(tRemain<=10){arc.classList.add('warning');cnt.classList.add('warning');}
  document.getElementById('timerSubLabel').textContent=tRemain===0?'TERMINAT ✓':(tTotal>=60?'MIN:SEC':'SECUNDE');
}
function adjustTimer(d){
  if(tRunning)return;
  const step=tTotal>=60?60:5;
  tTotal=Math.max(5,tTotal+d*step);tRemain=tTotal;
  document.getElementById('adjLabel').textContent=formatTime(tTotal);
  updateTimerUI();
}
function toggleExercise(dayId,sess,si,ei){const k=`${dayId}_${sess}_${si}_${ei}`;state.checked[k]=!state.checked[k];saveState();renderDay();updateNav();}
function toggleSection(dayId,sess,sName){const k=`${dayId}_${sess}_${sName}`;state.collapsed[k]=!state.collapsed[k];saveState();renderDay();}
function toggleComplete(dayId){const k=`${dayId}_${state.session}`;state.completed[k]=!state.completed[k];saveState();renderDay();updateNav();updateWeekProgress();}
function updateWeekProgress(){
  const n=DAYS.slice(0,6).filter(d=>state.completed[`${d.id}_morning`]||state.completed[`${d.id}_evening`]).length;
  const pct=Math.round(n/6*100);
  document.getElementById('weekFill').style.width=pct+'%';
  document.getElementById('weekStatLeft').textContent=`${n} / 6 zile active`;
  document.getElementById('weekStatRight').textContent=pct+'%';
}
function getDayProgress(){
  const day=DAYS[state.activeDay],sess=state.session;
  const sections=sess==='morning'?day.morning:day.evening;
  let t=0,d=0;
  sections.forEach((s,si)=>s.items.forEach((_,ei)=>{t++;if(state.checked[`${day.id}_${sess}_${si}_${ei}`])d++;}));
  return{total:t,done:d};
}
function renderNav(){
  document.getElementById('dayNav').innerHTML=DAYS.map((d,i)=>`
    <div class="day-pill ${i===state.activeDay?'active':''} ${(state.completed[`${d.id}_morning`]||state.completed[`${d.id}_evening`])?'done':''}" onclick="selectDay(${i})">
      <span class="pill-abbr">${d.label}</span><span class="pill-dot"></span>
    </div>`).join('');
}
function updateNav(){
  document.querySelectorAll('.day-pill').forEach((p,i)=>{
    p.className=`day-pill ${i===state.activeDay?'active':''} ${(state.completed[`${DAYS[i].id}_morning`]||state.completed[`${DAYS[i].id}_evening`])?'done':''}`;
  });
}
function selectDay(i){state.activeDay=i;saveState();renderNav();renderDay();}
function renderDay(){
  const day=DAYS[state.activeDay],sess=state.session;
  const sections=sess==='morning'?day.morning:day.evening;
  const{total,done}=getDayProgress();
  const cKey=`${day.id}_${sess}`,isComplete=state.completed[cKey];
  const sectionsHtml=sections.map((s,si)=>{
    const secKey=`${day.id}_${sess}_${s.name}`,isCollapsed=state.collapsed[secKey];
    const secDone=s.items.filter((_,ei)=>state.checked[`${day.id}_${sess}_${si}_${ei}`]).length;
    const secTotal=s.items.length,fillPct=secTotal>0?Math.round(secDone/secTotal*100):0;
    let noteHtml='';
    if(s.note){const nc=s.noteType==='warn'?'snote-warn':s.noteType==='ok'?'snote-ok':'snote-info';noteHtml=`<div class="snote ${nc}">${s.note}</div>`;}
    const itemsHtml=s.items.map((ex,ei)=>{
      const checked=state.checked[`${day.id}_${sess}_${si}_${ei}`];
      const nSafe=ex.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const timerBtn=ex.t?`<div class="timer-btn" onclick="event.stopPropagation();openTimer('${nSafe}',${ex.t})">⏱</div>`:'';
      const noteRow=ex.note?`<div class="ex-note">→ ${ex.note}</div>`:'';
      const rehabRow=ex.rehab?`<div class="ex-rehab">● ${ex.rehab}</div>`:'';
      return `<div class="exercise ${checked?'done':''}${ex.prio?' prio':''}">
        <div class="ex-check-wrap" onclick="toggleExercise('${day.id}','${sess}',${si},${ei})"><div class="ex-check"></div></div>
        <div class="ex-info" onclick="toggleExercise('${day.id}','${sess}',${si},${ei})">
          <div class="ex-name">${ex.n}</div>
          <div class="ex-sets">${ex.s}</div>
          ${noteRow}${rehabRow}
        </div>${timerBtn}</div>`;
    }).join('');
    const sNameSafe=s.name.replace(/'/g,"\\'");
    return `<div class="section ${isCollapsed?'collapsed':''}">
      <div class="section-header" onclick="toggleSection('${day.id}','${sess}','${sNameSafe}')">
        <span class="section-title">${s.name}</span>
        <span class="section-count">${secDone}/${secTotal}<span class="progress-mini"><span class="progress-mini-fill" style="width:${fillPct}%"></span></span><span class="chevron">▾</span></span>
      </div>
      <div class="section-body">${noteHtml}${itemsHtml}</div></div>`;
  }).join('');
  const sessIcon=sess==='morning'?'☀':'🌙',sessTxt=sess==='morning'?'Dimineață — Sală':'Seară — Acasă';
  const notesVal=(state.notes[cKey]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  document.getElementById('dayContent').innerHTML=`
    <div class="day-card">
      <div class="day-card-header">
        <div>
          <div class="day-card-title">${day.title}</div>
          <div class="day-card-meta">${day.meta} · ${sessIcon} ${sessTxt} · ${done}/${total}</div>
          <div class="day-focus">${day.focus}</div>
        </div>
        <span class="day-tag ${day.tag}">${day.tagLabel}</span>
      </div>${sectionsHtml}
    </div>
    <button class="complete-btn ${isComplete?'completed':'default'}" onclick="toggleComplete('${day.id}')">
      ${isComplete?`✓ ${sessTxt} Completată`:`Marchează ${sessTxt}`}
    </button>
    <textarea class="notes-area" placeholder="Note — greutăți, cum te-ai simțit, dureri..." oninput="saveNote('${cKey}',this.value)">${notesVal}</textarea>`;
}
function saveNote(k,v){state.notes[k]=v;saveState();}
loadState();renderNav();renderDay();updateWeekProgress();
document.getElementById('timerArc').style.strokeDasharray=CIRC;
document.getElementById('timerArc').style.strokeDashoffset=0;
document.getElementById('btnMorning').classList.toggle('active',state.session==='morning');
document.getElementById('btnEvening').classList.toggle('active',state.session==='evening');
document.getElementById('btnEvening').classList.toggle('evening',state.session==='evening');
</script>
</body>
</html>
